name: Build & Publish

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/widget.js   || (echo "Missing dist/widget.js"   && exit 1)
          test -f dist/widget.mjs  || (echo "Missing dist/widget.mjs"  && exit 1)
          test -f dist/widget.cjs  || (echo "Missing dist/widget.cjs"  && exit 1)
          test -f dist/widget.d.ts || (echo "Missing dist/widget.d.ts" && exit 1)
          test -f dist/bridge.js   || (echo "Missing dist/bridge.js"   && exit 1)
          # The script-tag and CommonJS outputs must run in strict mode,
          # as they did with Rollup. Rolldown only emits the directive
          # when output.strict is true, and puts it at the top of the file.
          for f in dist/widget.js dist/widget.cjs dist/bridge.js; do
            [ "$(head -c 13 "$f")" = '"use strict";' ] || (echo "$f does not start with \"use strict\";" && exit 1)
          done

      - name: Upload dist artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # OIDC Trusted Publishing — works because this repo is PUBLIC.
  # Token-less auth + signed provenance attestation tying every
  # publish to a specific repo + workflow + commit. Set up the
  # trusted publisher mapping on npmjs.com first:
  #   package settings → Trusted Publisher → Add
  #   repo: Fusion-Studios-Code/live-layer-sdk
  #   workflow: publish.yml
  publish-npm:
    name: Publish to npm
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # The tag is the release. Refuse to publish a package.json version
      # that does not match it (e.g. a tag pushed before the bump).
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION} (expected tag v${PKG_VERSION})"
            exit 1
          fi
          echo "Publishing ${PKG_VERSION} from tag ${GITHUB_REF_NAME}"

      # Node 24 bundles npm 11.x (24.5.0+ ship npm >= 11.5.1, the
      # minimum for OIDC trusted publishing), so npm is no longer
      # upgraded here. No dependency cache in the publish job: it
      # installs nothing, and setup-node's docs advise against caching
      # where OIDC tokens are available.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check npm supports trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "node $(node --version), npm ${NPM_VERSION}"
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) {
              console.error(`::error::npm ${process.argv[1]} is older than 11.5.1, the minimum for OIDC trusted publishing`);
              process.exit(1);
            }
          ' "${NPM_VERSION}"

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # --ignore-scripts skips prepublishOnly (it would re-run
      # `vite build` and need devDeps installed); the artifact we
      # just downloaded is the canonical built output.
      - name: Publish @livelayer/sdk
        run: npm publish --provenance --access public --ignore-scripts
